[project]
name = "rau"
version = "1.0.0"
description = "Rau — continuous local companion being"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0",
  "websockets>=12.0",
  "elevenlabs>=1.0",
]

[project.optional-dependencies]
local-voice = [
  "numpy>=1.26",
  "sounddevice>=0.5",
  "faster-whisper>=1.0",
  "silero-vad>=5.0",
  "torch>=2.0",
  "pedalboard>=0.9",
]
computer-use = [
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
]
pi = []
all = [
  "numpy>=1.26",
  "sounddevice>=0.5",
  "faster-whisper>=1.0",
  "silero-vad>=5.0",
  "torch>=2.0",
  "pedalboard>=0.9",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
]

[tool.setuptools.packages.find]
include = ["rau*"]
