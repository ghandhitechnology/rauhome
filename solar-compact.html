<!-- Solar System Dashboard - Self-contained HTML fragment for the body --><style> @import url('https: *{margin: 0;padding: 0;box-sizing: border-box;}body{font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;background: #0a0a1a;color: #e0e0f0;overflow-x: hidden;}.sd{display:flex;flex-direction:column;min-height:100vh;background:radial-gradient(ellipse at center,#0d0d2b 0%,#050510 100%);}.hd{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,30,0.8);border-bottom:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(10px);flex-shrink:0;flex-wrap:wrap;gap:8px;}.hd h1{font-size:20px;font-weight:600;letter-spacing:2px;background:linear-gradient(135deg,#f9d976,#f39c12,#e74c3c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}.hd .tm{font-size:14px;color:rgba(255,255,255,0.6);font-weight:300;letter-spacing:1px;}.ctrls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}.ctrls button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#e0e0f0;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;transition:all 0.2s;}.ctrls button:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25);}.ctrls button.act{background:rgba(243,156,18,0.2);border-color:#f39c12;}.ctrls label{font-size:12px;color:rgba(255,255,255,0.5);}.ctrls input[type=range]{width:100px;accent-color:#f39c12;background:transparent;}.ma{display:flex;flex:1;min-height:0;}.sc{flex:1;position:relative;overflow:hidden;}.sc canvas{display:block;width:100%;height:100%;}.sb{width:340px;background:rgba(10,10,30,0.85);border-left:1px solid rgba(255,255,255,0.06);padding:16px;overflow-y:auto;flex-shrink:0;backdrop-filter:blur(10px);}.sb h2{font-size:14px;font-weight:500;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;}.pl{display:flex;flex-direction:column;gap:6px;}.pi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all 0.2s;border:1px solid transparent;}.pi:hover{background:rgba(255,255,255,0.05);}.pi.sel{background:rgba(243,156,18,0.1);border-color:rgba(243,156,18,0.3);}.pd{width:12px;height:12px;border-radius:50%;flex-shrink:0;}.pi .nm{font-size:13px;font-weight:500;flex:1;}.pi .ds{font-size:11px;color:rgba(255,255,255,0.4);}.dp{margin-top:12px;padding:14px;background:rgba(255,255,255,0.04);border-radius:10px;border:1px solid rgba(255,255,255,0.06);display:none;}.dp.vs{display:block;}.dp h3{font-size:18px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;}.dp .dd{width:16px;height:16px;border-radius:50%;display:inline-block;}.dg{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;}.di{font-size:12px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);}.di .lb{color:rgba(255,255,255,0.4);font-size:10px;text-transform:uppercase;letter-spacing:0.5px;}.di .vl{font-weight:500;font-size:13px;}.ff{margin-top:10px;padding:10px;background:rgba(243,156,18,0.08);border-radius:8px;border-left:3px solid #f39c12;font-size:12px;line-height:1.5;color:rgba(255,255,255,0.8);}.ff::before{content:'✦ ';color:#f39c12;}.stb{display:flex;gap:16px;padding:8px 24px;background:rgba(10,10,30,0.6);border-top:1px solid rgba(255,255,255,0.04);font-size:11px;color:rgba(255,255,255,0.4);flex-shrink:0;flex-wrap:wrap;}.stb span{display:flex;align-items:center;gap:4px;}.stb .sv{color:rgba(255,255,255,0.7);font-weight:500;}@media(max-width:800px){.ma{flex-direction:column}.sb{width:100%;max-height:300px;border-left:none;border-top:1px solid rgba(255,255,255,0.06)}.sc{min-height:400px}}</style><div class="sd"><div class="hd"><h1>☀ SOLAR SYSTEM · LIVE</h1><div class="tm" id="tm">—</div><div class="ctrls"><button id="pb">⏸</button><label>Speed</label><input type="range" id="spd" min="0" max="5" step="0.1" value="1"><span id="spl" style="font-size:12px;color:rgba(255,255,255,0.5);min-width:30px;">1×</span><button id="trb" class="act">◯ Trails</button></div></div><div class="ma"><div class="sc" id="sc"><canvas id="cv"></canvas></div><div class="sb"><h2>Planets</h2><div class="pl" id="pl"></div><div class="dp" id="dp"><h3><span class="dd" id="dd"></span><span id="dn">—</span></h3><div class="dg" id="dg"></div><div class="ff" id="ff"></div></div></div></div><div class="stb" id="stb"></div></div><script> (function(){'use strict';const PD=[{id:'mercury',n:'Mercury',c:'#b5b5b5',oc:'rgba(181,181,181,0.12)',d:57.9,p:88,sp:47.87,t:'-180..430°C',m:0,ti:0.034,r:2440,fn:'A year on Mercury is just 88 Earth days — you\'d have 4 birthdays per Earth year!',ot:7.0},{id:'venus',n:'Venus',c:'#e8cda0',oc:'rgba(232,205,160,0.12)',d:108.2,p:225,sp:35.02,t:'462°C avg',m:0,ti:177.4,r:6052,fn:'Venus rotates backwards — the Sun rises in the west and sets in the east!',ot:3.4},{id:'earth',n:'Earth',c:'#4b8bbe',oc:'rgba(75,139,190,0.15)',d:149.6,p:365.25,sp:29.78,t:'-89..57°C',m:1,ti:23.44,r:6371,fn:'Earth is the only known planet with liquid water on its surface and life.',ot:0},{id:'mars',n:'Mars',c:'#c1440e',oc:'rgba(193,68,14,0.12)',d:227.9,p:687,sp:24.07,t:'-87..-5°C',m:2,ti:25.19,r:3390,fn:'Olympus Mons on Mars is 2.5× the height of Everest — the largest volcano in the solar system!',ot:1.85},{id:'jupiter',n:'Jupiter',c:'#d4a574',oc:'rgba(212,165,116,0.12)',d:778.5,p:4333,sp:13.07,t:'-108°C avg',m:95,ti:3.13,r:69911,fn:'Jupiter\'s Great Red Spot is a storm larger than Earth that has raged for hundreds of years!',ot:1.3},{id:'saturn',n:'Saturn',c:'#ead6b8',oc:'rgba(234,214,184,0.12)',d:1434,p:10759,sp:9.69,t:'-139°C avg',m:146,ti:26.73,r:58232,fn:'Saturn is so light it would float in water — its density is less than water\'s!',ot:2.49},{id:'uranus',n:'Uranus',c:'#d1e7e7',oc:'rgba(209,231,231,0.12)',d:2871,p:30687,sp:6.81,t:'-197°C avg',m:27,ti:97.77,r:25362,fn:'Uranus rotates on its side — it\'s basically rolling around the Sun like a ball!',ot:0.77},{id:'neptune',n:'Neptune',c:'#3b5c9c',oc:'rgba(59,92,156,0.12)',d:4495,p:60190,sp:5.43,t:'-201°C avg',m:16,ti:28.32,r:24622,fn:'Neptune has the strongest winds in the solar system — up to 2,100 km/h!',ot:1.77}];const st={paused:false,speed:1,time:0,showTrails:true,selId:null,planets:PD.map(p=>({...p,angle:Math.random()*Math.PI*2,trail:[]}))};const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),sc=document.getElementById('sc');const tm=document.getElementById('tm'),pb=document.getElementById('pb'),spd=document.getElementById('spd'),spl=document.getElementById('spl'),trb=document.getElementById('trb');const pl=document.getElementById('pl'),dp=document.getElementById('dp'),dd=document.getElementById('dd'),dn=document.getElementById('dn'),dg=document.getElementById('dg'),ff=document.getElementById('ff'),stb=document.getElementById('stb');let stars=[],W,H,cx,cy,scale,sunR;function resize(){const r=sc.getBoundingClientRect(),dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);cx=W/2;cy=H/2;scale=Math.min(W,H)*0.38/4495;sunR=Math.max(12,Math.min(28,scale*6955));if(stars.length===0){stars=[];for(let i=0;i<600;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+0.3,a:Math.random()*0.7+0.3,tw:Math.random()*Math.PI*2});}}function draw(){ctx.clearRect(0,0,W,H);const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.7);grd.addColorStop(0,'#0d0d2b');grd.addColorStop(0.5,'#080818');grd.addColorStop(1,'#020208');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);for(const s of stars){const tw=0.6+0.4*Math.sin(st.time*0.5+s.tw);ctx.globalAlpha=s.a*tw;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;if(st.showTrails){for(const p of st.planets){if(p.trail.length<2)continue;ctx.beginPath();const tr=p.trail;ctx.moveTo(tr[0].x,tr[0].y);for(let i=1;i<tr.length;i++)ctx.lineTo(tr[i].x,tr[i].y);ctx.strokeStyle=p.c;ctx.globalAlpha=0.15;ctx.lineWidth=1;ctx.stroke();ctx.globalAlpha=1;}}for(const p of st.planets){const r=p.d*scale;if(r<5)continue;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle=p.oc;ctx.lineWidth=0.5;ctx.stroke();}const sgrd=ctx.createRadialGradient(cx,cy,0,cx,cy,sunR*4);sgrd.addColorStop(0,'rgba(255,200,50,0.4)');sgrd.addColorStop(0.3,'rgba(255,150,0,0.15)');sgrd.addColorStop(1,'transparent');ctx.fillStyle=sgrd;ctx.beginPath();ctx.arc(cx,cy,sunR*4,0,Math.PI*2);ctx.fill();const sgrd2=ctx.createRadialGradient(cx-sunR*0.3,cy-sunR*0.3,0,cx,cy,sunR);sgrd2.addColorStop(0,'#fff7e0');sgrd2.addColorStop(0.3,'#ffe066');sgrd2.addColorStop(0.7,'#ff9900');sgrd2.addColorStop(1,'#ff6600');ctx.fillStyle=sgrd2;ctx.beginPath();ctx.arc(cx,cy,sunR,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,200,50,0.08)';ctx.lineWidth=2;for(let i=0;i<12;i++){const a=i*Math.PI/6+st.time*0.02;ctx.beginPath();ctx.arc(cx+Math.cos(a)*sunR*0.5,cy+Math.sin(a)*sunR*0.5,sunR*1.3,0,Math.PI*2);ctx.stroke();}for(const p of st.planets){const r=p.d*scale;const tiltRad=p.ot*Math.PI/180;const x=cx+Math.cos(p.angle)*r;const y=cy+Math.sin(p.angle)*r*Math.cos(tiltRad);const pr=Math.max(2.5,Math.min(16,scale*p.r*2));const pgrd=ctx.createRadialGradient(x,y,0,x,y,pr*3);pgrd.addColorStop(0,p.c);pgrd.addColorStop(1,'transparent');ctx.globalAlpha=0.12;ctx.fillStyle=pgrd;ctx.beginPath();ctx.arc(x,y,pr*3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(x,y,pr,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.12)';ctx.beginPath();ctx.arc(x-pr*0.2,y-pr*0.2,pr*0.35,0,Math.PI*2);ctx.fill();if(p.id==='saturn'){ctx.strokeStyle='rgba(210,190,160,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,pr*1.8,pr*0.5,0.3,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='rgba(210,190,160,0.25)';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(x,y,pr*2.3,pr*0.65,0.3,0,Math.PI*2);ctx.stroke();}if(p.id==='earth'){const moonAngle=st.time*3+p.angle;const moonDist=pr*2.5;const mx=x+Math.cos(moonAngle)*moonDist;const my=y+Math.sin(moonAngle)*moonDist;ctx.fillStyle='#ddd';ctx.beginPath();ctx.arc(mx,my,Math.max(1.5,pr*0.3),0,Math.PI*2);ctx.fill();}if(p.id==='jupiter'){ctx.fillStyle='rgba(200,80,50,0.4)';ctx.beginPath();ctx.ellipse(x+pr*0.3,y+pr*0.1,pr*0.25,pr*0.15,0,0,Math.PI*2);ctx.fill();}ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='10px Space Grotesk,sans-serif';ctx.textAlign='center';ctx.fillText(p.n,x,y+pr+12);if(st.selId===p.id){ctx.strokeStyle='rgba(243,156,18,0.5)';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(x,y,pr+6,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}}}function update(dt){if(st.paused)return;st.time+=dt*st.speed;for(const p of st.planets){const angSpeed=(2*Math.PI)/(p.p*0.5);p.angle+=angSpeed*dt*st.speed;const r=p.d*scale;const tiltRad=p.ot*Math.PI/180;const x=cx+Math.cos(p.angle)*r;const y=cy+Math.sin(p.angle)*r*Math.cos(tiltRad);p.trail.push({x,y});if(p.trail.length>200)p.trail.shift();}}function buildUI(){pl.innerHTML='';for(const p of st.planets){const div=document.createElement('div');div.className='pi'+(st.selId===p.id?' sel':'');div.innerHTML='<span class="pd" style="background:'+p.c+'"></span><span class="nm">'+p.n+'</span><span class="ds">'+p.d+'M km</span>';div.addEventListener('click',()=>selectPlanet(p.id));pl.appendChild(div);}const total=st.planets.length;const inner=st.planets.map(p=>'<span>● <span class="sv">'+p.n+'</span><span style="color:rgba(255,255,255,0.3)">'+p.d+'M km</span></span>').join('');stb.innerHTML='<span>Planets: <span class="sv">'+total+'</span></span><span>Speed: <span class="sv" id="curSpeed">1.0×</span></span>'+inner;}function selectPlanet(id){st.selId=id;const p=st.planets.find(x=>x.id===id);if(!p){dp.classList.remove('vs');return;}dp.classList.add('vs');dd.style.background=p.c;dn.textContent=p.n;dg.innerHTML= '<div class="di"><div class="lb">Distance from Sun</div><div class="vl">'+p.d+'M km</div></div>'+ '<div class="di"><div class="lb">Orbital Period</div><div class="vl">'+p.p+' days</div></div>'+ '<div class="di"><div class="lb">Orbital Speed</div><div class="vl">'+p.sp+' km/s</div></div>'+ '<div class="di"><div class="lb">Temperature</div><div class="vl">'+p.t+'</div></div>'+ '<div class="di"><div class="lb">Moons</div><div class="vl">'+p.m+'</div></div>'+ '<div class="di"><div class="lb">Axial Tilt</div><div class="vl">'+p.ti+'°</div></div>'+ '<div class="di"><div class="lb">Radius</div><div class="vl">'+p.r.toLocaleString()+' km</div></div>'+ '<div class="di"><div class="lb">Orbit Tilt</div><div class="vl">'+p.ot+'°</div></div>';ff.textContent=p.fn;document.querySelectorAll('.pi').forEach((el,i)=>{el.classList.toggle('sel',st.planets[i].id===id);});}function updateClock(){const d=new Date();tm.textContent=d.toLocaleString('en-US',{weekday:'short',year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});}pb.addEventListener('click',()=>{st.paused=!st.paused;pb.textContent=st.paused?'▶':'⏸';});spd.addEventListener('input',()=>{st.speed=parseFloat(spd.value);spl.textContent=st.speed.toFixed(1)+'×';const cs=document.getElementById('curSpeed');if(cs)cs.textContent=st.speed.toFixed(1)+'×';});trb.addEventListener('click',()=>{st.showTrails=!st.showTrails;trb.classList.toggle('act');});cv.addEventListener('click',(e)=>{const rect=cv.getBoundingClientRect();const mx=e.clientX-rect.left;const my=e.clientY-rect.top;let best=null, bestDist=Infinity;for(const p of st.planets){const r=p.d*scale;const tiltRad=p.ot*Math.PI/180;const x=cx+Math.cos(p.angle)*r;const y=cy+Math.sin(p.angle)*r*Math.cos(tiltRad);const d=Math.hypot(mx-x,my-y);if(d<bestDist){bestDist=d;best=p.id;}}if(bestDist<50)selectPlanet(best);});let lastTime=0;function loop(ts){const dt=Math.min((ts-lastTime)/1000,0.05);lastTime=ts;update(dt);draw();updateClock();requestAnimationFrame(loop);}window.addEventListener('resize',resize);resize();buildUI();selectPlanet('earth');requestAnimationFrame(loop);})();</script>
