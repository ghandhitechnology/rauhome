<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rau</title>
    <meta name="description" content="Rau — one continuous mind, running locally." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Fonts are served from /fonts (see web/public/fonts/LICENSE.md), not from
      fonts.googleapis.com. Rau runs on localhost and has to look the same with
      the network off. Preloaded because the @font-face rules live inside the
      bundled CSS, which the browser only discovers a round-trip later — without
      these two hints the wordmark still flashes its fallback on a cold load.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-serif-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/dm-sans-latin.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
